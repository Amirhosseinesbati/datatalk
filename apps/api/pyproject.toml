[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "datatalk-api"
version = "0.1.0"
description = "Workspace-scoped conversational sales analytics"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "sqlglot>=26,<30",
  "argon2-cffi>=23,<26",
  "python-multipart>=0.0.20,<1",
  "langchain>=1.0,<2",
  "langchain-core>=1.0,<2",
  "langchain-openai>=0.3,<2",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-postgres>=2.0,<4",
  "langsmith>=0.3,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.8,<1", "mypy>=1.15,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/datatalk"]

[tool.pytest.ini_options]
testpaths = ["../../tests/api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
